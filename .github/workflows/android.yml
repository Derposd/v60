name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk V60-Brew.apk

      - uses: actions/upload-artifact@v4
        with:
          name: V60-Brew
          path: V60-Brew.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest V60-Brew.apk \
            --target "$GITHUB_SHA" \
            --title "V60 Brew (сборка ${{ github.run_number }})" \
            --notes "Скачайте V60-Brew.apk на телефон и установите. Новые сборки ставятся поверх старых — рецепты сохраняются." \
            --prerelease
