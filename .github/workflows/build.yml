name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  # Version of the build from main. A vX.Y.Z tag overrides it.
  APP_VERSION: "1.1.0"
  PRESENTMON_VERSION: "2.6.0"
  INNOSETUP_VERSION: "6.4.3"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download PresentMon (MIT, embedded into the app and the installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer/tools | Out-Null
          $v = $env:PRESENTMON_VERSION
          Invoke-WebRequest "https://github.com/GameTechDev/PresentMon/releases/download/v$v/PresentMon-$v-x64.exe" -OutFile "installer/tools/PresentMon-$v-x64.exe"
          Invoke-WebRequest "https://raw.githubusercontent.com/GameTechDev/PresentMon/v$v/LICENSE.txt" -OutFile "installer/tools/PresentMon-LICENSE.txt"

      - name: Test
        run: dotnet test tests/Dota2Optimizer.Tests -c Release

      - name: Version
        id: ver
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Only accept plain vX.Y.Z tags, so the ref name never reaches a command line unchecked.
          $v = $env:APP_VERSION
          if ($env:REF_TYPE -eq "tag" -and $env:REF_NAME -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1] }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        run: dotnet publish src/Dota2Optimizer.App -c Release -r win-x64 -o artifacts/publish -p:Version=${{ steps.ver.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Get Inno Setup
        shell: pwsh
        run: |
          $v = $env:INNOSETUP_VERSION
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/tools.innosetup/$v/tools.innosetup.$v.nupkg" -OutFile inno.zip
          Expand-Archive inno.zip -DestinationPath inno -Force

      - name: Build Dota2Optimizer-Setup.exe
        run: inno\tools\ISCC.exe /DAppVersion=${{ steps.ver.outputs.version }} installer\Dota2Optimizer.iss

      # Build artifacts are a convenience for branches and PRs; main publishes a release instead.
      # A full artifact storage quota must not block the release.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        with:
          retention-days: 7
          name: Dota2Optimizer-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/Dota2Optimizer-Setup.exe
            artifacts/publish/Dota2Optimizer.exe

      # Every push to main (and every vX.Y.Z tag) publishes the installer as the latest release,
      # so README can link straight to releases/latest/download/Dota2Optimizer-Setup.exe.
      - name: Release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Dota 2 Optimizer ${{ steps.ver.outputs.version }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            installer/Output/Dota2Optimizer-Setup.exe
            artifacts/publish/Dota2Optimizer.exe
